# ============================================================
# Nginx Configuration for AI Novel Workshop
# - SPA fallback to index.html
# - Gzip compression
# - Static asset caching
# - Security headers
# - Reverse proxy to backend API
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Request size limit (for file uploads)
    client_max_body_size 50m;

    # --------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff2;

    # --------------------------------------------------------
    # Upstream backend servers
    # --------------------------------------------------------
    upstream backend {
        server backend:8000;
    }

    # --------------------------------------------------------
    # Main server
    # --------------------------------------------------------
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ----------------------------------------------------
        # Security Headers
        # ----------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ----------------------------------------------------
        # API reverse proxy to backend
        # ----------------------------------------------------
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (for streaming AI responses)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts for long AI generation requests
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ----------------------------------------------------
        # Static assets with long-term caching
        # Vite outputs hashed filenames, so safe to cache forever
        # ----------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Pre-compressed gzip assets (Vite vite-plugin-compression)
        location ~* \.(js|css|svg)$ {
            gzip_static on;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Images and fonts
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # Service worker -- no cache, always revalidate
        location = /sw.js {
            expires 0;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # PWA manifest
        location = /manifest.json {
            expires 1h;
            add_header Cache-Control "public";
        }

        # ----------------------------------------------------
        # SPA fallback: all unmatched routes -> index.html
        # ----------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;

            # No cache for HTML (SPA navigation)
            add_header Cache-Control "no-cache";
        }

        # ----------------------------------------------------
        # Health check endpoint for Docker healthcheck
        # ----------------------------------------------------
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ----------------------------------------------------
        # Deny access to hidden files
        # ----------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
