<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI小说工坊 - 离线模式</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #0a0a0f;
      color: #ececf1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .offline-container {
      text-align: center;
      max-width: 480px;
    }

    .offline-icon {
      font-size: 72px;
      margin-bottom: 24px;
      display: block;
    }

    .offline-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ececf1;
    }

    .offline-message {
      font-size: 15px;
      color: #8e8ea0;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .retry-button {
      display: inline-block;
      padding: 12px 32px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .retry-button:hover {
      background: #7c6df7;
    }

    .retry-button:active {
      background: #5b4bd6;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 8px;
      vertical-align: middle;
    }

    .status-dot.online {
      background: #10b981;
    }

    .connection-status {
      font-size: 13px;
      color: #565869;
      margin-top: 24px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .reconnecting {
      animation: pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <span class="offline-icon" role="img" aria-label="offline">&#x1F4F6;</span>
    <h1 class="offline-title">网络连接已断开</h1>
    <p class="offline-message">
      当前无法访问网络。AI小说工坊的部分功能需要网络连接才能使用，包括AI生成、云端同步等。
      <br /><br />
      您之前编辑的内容已自动保存在本地，恢复连接后可继续正常使用。
    </p>
    <button class="retry-button" id="retryBtn" onclick="retryConnection()">
      重新连接
    </button>
    <p class="connection-status" id="connectionStatus">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">正在检测网络状态...</span>
    </p>
  </div>

  <script>
    var statusDot = document.getElementById('statusDot');
    var statusText = document.getElementById('statusText');
    var retryBtn = document.getElementById('retryBtn');

    function updateStatus() {
      if (navigator.onLine) {
        statusDot.className = 'status-dot online';
        statusText.textContent = '网络已恢复，正在跳转...';
        retryBtn.textContent = '跳转中...';
        setTimeout(function() {
          window.location.href = '/';
        }, 800);
      } else {
        statusDot.className = 'status-dot';
        statusText.textContent = '仍然离线，请检查网络连接';
        retryBtn.textContent = '重新连接';
        retryBtn.classList.remove('reconnecting');
      }
    }

    function retryConnection() {
      statusText.textContent = '正在重新连接...';
      statusDot.className = 'status-dot reconnecting';
      retryBtn.classList.add('reconnecting');

      // Try fetching a small resource to verify connectivity
      fetch('/', { method: 'HEAD', cache: 'no-store' })
        .then(function() {
          updateStatus();
        })
        .catch(function() {
          setTimeout(updateStatus, 1000);
        });
    }

    // Listen for online/offline events
    window.addEventListener('online', function() {
      updateStatus();
    });

    window.addEventListener('offline', function() {
      statusDot.className = 'status-dot';
      statusText.textContent = '网络连接已断开';
    });

    // Initial check
    updateStatus();

    // Periodic connectivity check
    setInterval(function() {
      if (!navigator.onLine) return;
      fetch('/', { method: 'HEAD', cache: 'no-store' })
        .then(function() { updateStatus(); })
        .catch(function() { /* still offline */ });
    }, 10000);
  </script>
</body>
</html>
