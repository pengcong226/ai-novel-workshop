# ============================================================
# Docker Compose - Production Environment
# Usage: docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:
  # ----------------------------------------------------------
  # Frontend: Nginx serving compiled Vue assets
  # ----------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: ai-novel-workshop-frontend-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------
  # Backend: FastAPI (Python)
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-novel-workshop-backend-prod
    expose:
      - "8000"
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - ENVIRONMENT=production
      # Provide secrets via .env file or Docker secrets
      # - OPENAI_API_KEY=sk-...
      # - ANTHROPIC_API_KEY=sk-ant-...
    volumes:
      - backend_prod_data:/app/data
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------
  # Nginx reverse proxy: routes / to frontend, /api to backend
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: ai-novel-workshop-proxy-prod
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend_prod_data:
    driver: local
