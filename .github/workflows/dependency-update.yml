name: Dependency Update

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check for outdated packages
        id: outdated
        run: |
          echo "## Outdated Packages" >> "$GITHUB_STEP_SUMMARY"
          OUTDATED=$(npm outdated --json 2>/dev/null || true)
          if [ -z "$OUTDATED" ] || [ "$OUTDATED" = "{}" ]; then
            echo "All packages are up to date." >> "$GITHUB_STEP_SUMMARY"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            echo "$OUTDATED" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run npm update (non-breaking)
        if: steps.outdated.outputs.has_updates == 'true'
        run: |
          npm update --save
          npm audit fix --force || true

      - name: Verify updated deps build
        if: steps.outdated.outputs.has_updates == 'true'
        run: |
          npm run type-check
          npm run test:run
          npm run build

      - name: Compute update summary
        if: steps.outdated.outputs.has_updates == 'true'
        id: summary
        run: |
          DIFF=$(git diff --stat)
          echo "diff<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIFF" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "has_changes=$(git diff --quiet && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.summary.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automated/dependency-updates
          title: 'chore(deps): weekly dependency updates'
          body: |
            ## Weekly Dependency Updates

            Automated weekly update of npm dependencies.

            ### Changes
            ```
            ${{ steps.summary.outputs.diff }}
            ```

            ### Verification
            - [x] Type check passed
            - [x] Tests passed
            - [x] Build succeeded

            > This PR was created automatically by the dependency update workflow.
          commit-message: 'chore(deps): update npm dependencies'
          labels: |
            dependencies
            automated
          delete-branch: true

  rust-deps:
    name: Update Rust Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check for outdated Rust crates
        id: rust-outdated
        run: |
          if command -v cargo-outdated &>/dev/null; then
            cargo outdated --manifest-path src-tauri/Cargo.toml 2>/dev/null || true
          else
            echo "cargo-outdated not installed, skipping Rust dependency check"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Cargo.lock
        if: steps.rust-outdated.outputs.has_updates != 'false'
        run: |
          cd src-tauri
          cargo update
          echo "has_changes=$(git diff --quiet Cargo.lock && echo false || echo true)" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Verify Rust build
        if: steps.rust-outdated.outputs.has_updates != 'false'
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml
        continue-on-error: true
