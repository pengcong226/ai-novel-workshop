name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Gate: type-check + test must pass before any artifact is published
  # ─────────────────────────────────────────────
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm run test:run

  # ─────────────────────────────────────────────
  # Web build artifact (always produced)
  # ─────────────────────────────────────────────
  build-web:
    name: Build Web
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create web archive
        run: |
          cd dist
          tar -czf ../ai-novel-workshop-web-${{ github.ref_name }}.tar.gz .
          zip -r ../ai-novel-workshop-web-${{ github.ref_name }}.zip .

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: |
            ai-novel-workshop-web-${{ github.ref_name }}.tar.gz
            ai-novel-workshop-web-${{ github.ref_name }}.zip
          retention-days: 90

  # ─────────────────────────────────────────────
  # Desktop (Tauri) builds for all three platforms
  # ─────────────────────────────────────────────
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple code signing (set in repo secrets for macOS builds)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (optional)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI小说工坊 ${{ github.ref_name }}'
          releaseBody: |
            ## AI小说工坊 ${{ github.ref_name }}

            ### Downloads
            - **Windows**: `.msi` installer or `.exe` portable
            - **macOS**: `.dmg` for Apple Silicon
            - **Linux**: `.deb`, `.AppImage`, or `.rpm`
            - **Web**: `.tar.gz` or `.zip` archive (self-hosted)

            ### Changes
            See the [CHANGELOG](./CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }}

  # ─────────────────────────────────────────────
  # Generate changelog and finalize the GitHub release
  # ─────────────────────────────────────────────
  changelog:
    name: Generate Changelog
    needs: [build-web, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-release
          path: web-artifacts/

      - name: Generate changelog from commits
        id: changelog
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          CURRENT_TAG="${{ github.ref_name }}"

          echo "## What's Changed" > changelog.md
          echo "" >> changelog.md

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$CURRENT_TAG" ]; then
            echo "Comparing $PREV_TAG..$CURRENT_TAG"
            git log "$PREV_TAG..$CURRENT_TAG" --pretty=format:"- %s (%h)" >> changelog.md
          else
            git log --pretty=format:"- %s (%h)" -20 >> changelog.md
          fi

          echo "" >> changelog.md
          echo "" >> changelog.md
          echo "### Assets" >> changelog.md
          echo "| Platform | File |" >> changelog.md
          echo "|----------|------|" >> changelog.md
          echo "| Web (tar.gz) | \`ai-novel-workshop-web-${CURRENT_TAG}.tar.gz\` |" >> changelog.md
          echo "| Web (zip) | \`ai-novel-workshop-web-${CURRENT_TAG}.zip\` |" >> changelog.md
          echo "| Windows | \`.msi\` / \`.exe\` |" >> changelog.md
          echo "| macOS | \`.dmg\` |" >> changelog.md
          echo "| Linux | \`.deb\` / \`.AppImage\` / \`.rpm\` |" >> changelog.md

          echo "" >> changelog.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}" >> changelog.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.md
          retention-days: 90
